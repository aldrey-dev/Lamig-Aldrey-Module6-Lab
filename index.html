<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Student Registration</h2>

        <form id="registrationForm">
            <div class="form-group">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" required>
                <span id="fullNameError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="studentNumber">Student number</label>
                <input type="text" id="studentNumber" required>
                <span id="studentNumberError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" required>
                <span id="emailError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="mobileNumber">Mobile number</label>
                <input type="tel" id="mobileNumber" required>
                <span id="mobileNumberError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required aria-describedby="passwordFeedback">
                <span id="passwordFeedback" class="feedback"></span>
                <span id="passwordError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" required>
                <span id="confirmPasswordError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" required>
                    <option value="">Select your course</option>
                    <option value="BSIT">BSIT</option>
                    <option value="BSCS">BSCS</option>
                </select>
                <span id="courseError" class="error"></span>
            </div>

            <div class="form-group">
                <label>
                    <input type="checkbox" id="terms" required>
                    Terms agreement
                </label>
                <span id="termsError" class="error"></span>
            </div>

            <div class="btn-group">
                <button type="submit" id="registerBtn">Register</button>
                <button type="reset" id="resetBtn">Reset</button>
            </div>

            <div id="successMessage" class="success"></div>
            <div id="registrationSummary" class="summary" hidden>
                <h3>Registration Summary</h3>
                <p><strong>Full name:</strong> <span id="summaryName"></span></p>
                <p><strong>Student number:</strong> <span id="summaryStudentNumber"></span></p>
                <p><strong>Email address:</strong> <span id="summaryEmail"></span></p>
                <p><strong>Mobile number:</strong> <span id="summaryMobileNumber"></span></p>
                <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
            </div>
        </form>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
